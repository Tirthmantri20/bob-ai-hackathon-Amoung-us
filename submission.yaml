submission:
  title: "SupplyGuard AI"

  problem_statement: >
    Global supply chains and temperature-sensitive cold chains face multi-billion dollar losses due to reactive management during infrastructure disruptions and extreme weather. Logistics managers and dispatchers struggle with alert fatigue, blind disruption propagation, and lagging cold-chain visibility that alerts operators only after temperature thresholds have breached.

  solution_summary: >
    SupplyGuard AI is an autonomous supply-chain risk mitigation control tower and cold-chain fleet utilization optimizer. Through Step 3, it delivers a high-performance FastAPI service featuring deterministic 5-factor risk scoring, regulatory cold-chain excursion detection, multi-criteria route optimization, and emergency idle reefer asset matching.

  key_features:
    - "Multi-factor real-time shipment risk scoring (0-100) across disruptions, weather, route, cold-chain, and business impact"
    - "Automated cold-chain excursion detection and severity classification against regulatory cargo rules"
    - "Multi-criteria candidate route optimization evaluating ETA, cost, disruption avoidance, and weather exposure"
    - "Proactive emergency idle fleet asset matcher for reefer transfer and distress mitigation"
    - "Comprehensive FastAPI REST API with automated SQLite database lifecycle and idempotent seed data loading"

  tech_stack:
    languages: ["Python"]
    frameworks: ["FastAPI", "SQLAlchemy", "Pydantic"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]
    databases: ["SQLite"]
    other: ["Uvicorn", "pytest"]

  what_we_are_most_proud_of: >
    Our robust mathematical modeling and pure deterministic intelligence engines (risk scoring, cold-chain excursion detection, and multi-criteria routing/fleet matching) engineered with clean domain boundaries, complete Pydantic v2 schemas, and 143 passing unit and integration tests.

  known_limitations: >
    Completed through Step 3 (Core Data Foundation, Intelligence Engines, and REST API routes). watsonx.ai natural language incident explanation generation, Model Context Protocol (MCP) agent tool registration, and the frontend web dashboard are planned in subsequent steps.

